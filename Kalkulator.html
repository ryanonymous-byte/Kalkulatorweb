<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        .kalkulator {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 320px;
        }
        .layar {
            width: 100%;
            height: 70px;
            background-color: #e8e8e8;
            border: none;
            border-radius: 8px;
            text-align: right;
            padding: 15px;
            font-size: 24px;
            margin-bottom: 15px;
        }
        .tombol {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 18px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            opacity: 0.8;
        }
        .angka {
            background-color: #ddd;
        }
        .operator {
            background-color: #ff9500;
            color: white;
        }
        .hapus {
            background-color: #ff3b30;
            color: white;
        }
        .sama-dengan {
            background-color: #4cd964;
            color: white;
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="kalkulator">
        <input type="text" class="layar" id="layar" readonly>
        <div class="tombol">
            <button class="hapus" onclick="hapusSemua()">C</button>
            <button class="hapus" onclick="hapusSatu()">⌫</button>
            <button class="operator" onclick="tampil('.')">.</button>
            <button class="operator" onclick="tampil('/')">/</button>

            <button class="angka" onclick="tampil('7')">7</button>
            <button class="angka" onclick="tampil('8')">8</button>
            <button class="angka" onclick="tampil('9')">9</button>
            <button class="operator" onclick="tampil('*')">×</button>

            <button class="angka" onclick="tampil('4')">4</button>
            <button class="angka" onclick="tampil('5')">5</button>
            <button class="angka" onclick="tampil('6')">6</button>
            <button class="operator" onclick="tampil('-')">-</button>

            <button class="angka" onclick="tampil('1')">1</button>
            <button class="angka" onclick="tampil('2')">2</button>
            <button class="angka" onclick="tampil('3')">3</button>
            <button class="operator" onclick="tampil('+')">+</button>

            <button class="angka" onclick="tampil('0')">0</button>
            <button class="sama-dengan" onclick="hitung()">=</button>
        </div>
    </div>

    <script>
        const layar = document.getElementById('layar');

        function tampil(nilai) {
            layar.value += nilai;
        }

        function hapusSemua() {
            layar.value = '';
        }

        function hapusSatu() {
            layar.value = layar.value.slice(0, -1);
        }

        function hitung() {
            try {
                // Menggunakan eval dengan pengecekan aman
                if (layar.value === '') return;
                let hasil = eval(layar.value);
                layar.value = hasil;
            } catch (error) {
                layar.value = 'Error';
                setTimeout(() => layar.value = '', 1500);
            }
        }
    </script>
</body>
</html>
